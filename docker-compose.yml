#########################################################
# Bases
#########################################################
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: fourdrinier
  environment:
    K8S_API_HOST: ${K8S_API_HOST:-https://host.docker.internal:6443}
    K8S_TOKEN_PATH: /var/run/secrets/kubernetes.io/serviceaccount/token
    K8S_CA_CERT_PATH: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    K8S_NAMESPACE: minecraft
    MINECRAFT_IMAGE: ${MINECRAFT_IMAGE:-itzg/minecraft-server:java17-alpine}
    MINECRAFT_PVC_SIZE: ${MINECRAFT_PVC_SIZE:-5Gi}
    MINECRAFT_STORAGE_CLASS: ${MINECRAFT_STORAGE_CLASS:-local-path}
  networks:
    - fourdrinier-network
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  #########################################################
  # Production (Monolithic: Backend serves Frontend)
  #########################################################
  app:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    ports:
      - "8000:8000"
    volumes:
      - ./tmp:/fd/db-data
      - ./ssh:/root/.ssh
      - ./.k8s/token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./.k8s/ca.crt:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt:ro
    profiles: [production]

  #########################################################
  # Testing
  #########################################################
  app_test:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    ports:
      - "8000:8000"
    volumes:
      - test-data:/fd/db-data
      - ./ssh:/root/.ssh
      - ./.k8s/token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./.k8s/ca.crt:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt:ro
    profiles: [testing]

  #########################################################
  # Debug/Development (Hot Reloading - Separate Services)
  #########################################################
  backend_debug:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-debug
    ports:
      - "8000:8000"
    volumes:
      - ./tmp:/fd/db-data
      - ./ssh:/root/.ssh
      - ./.k8s/token:/var/run/secrets/kubernetes.io/serviceaccount/token:ro
      - ./.k8s/ca.crt:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt:ro
      # Mount backend source code for hot reloading
      - ./backend/fourdrinier:/fd/backend/fourdrinier
    profiles: [debug]

  frontend_debug:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-debug
    ports:
      - "3000:3000"
    volumes:
      # Mount frontend source code for hot reloading
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000
    networks:
      - fourdrinier-network
    depends_on:
      - backend_debug
    profiles: [debug]

volumes:
  db-data:
  test-data:

networks:
  fourdrinier-network:
