[project]
name = "fourdrinier"
version = "0.1.0"
description = "Fourdrinier backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    # docker SSH transport subclasses docker-py internals (SSHHTTPAdapter);
    # keep the major version pinned and re-verify on upgrade.
    "docker>=7.1,<8",
    "paramiko>=3.4",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
