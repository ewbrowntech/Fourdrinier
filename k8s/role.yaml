apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minecraft-manager
  namespace: minecraft
rules:
  # Pod management
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "watch"]

  # PVC management
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete", "watch"]

  # Service management (for LoadBalancer)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete", "watch"]

  # Pod logs (optional, for debugging)
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
